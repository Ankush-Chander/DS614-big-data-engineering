        - "Hadoop Single Node Cluster": 'code/batch_processing/hadoop single node cluster.md'
        - "Non Sudoer Hadoop Single Node Cluster": 'code/batch_processing/non_sudoer_hadoop_single_node_cluster.md'
        
## Configuration
theme:
  name: material
#  custom_dir: docs/theme_override_home/
  # 404 page
#  static_templates:
#    - 404.html
  # Don't include MkDocs' JavaScript
  include_search_page: false
  search_index_only: true
  # Default values, taken from mkdocs_theme.yml
  language: en
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.footer
    # - navigation.indexes
  palette:
    primary: indigo
    accent: purple
  font:
    text: Roboto
    code: Roboto Mono
  
#  icon:  # from .icons path. Add to theme override for custom logo.
